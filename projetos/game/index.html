<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no evita zoom por toque duplo; viewport-fit=cover usa a tela toda -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Dellalos - Aventura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- O canvas é a "tela" onde o jogo é desenhado. 1200x896 é o tamanho interno do mundo (igual ao da Sala.jpg). -->
  <canvas id="jogo" width="1200" height="896"></canvas>

  <!-- Controles virtuais: D-pad no canto esquerdo -->
  <div id="dpad" aria-label="Direcional">
    <button class="dir" data-dir="up"    aria-label="Cima">▲</button>
    <button class="dir" data-dir="left"  aria-label="Esquerda">◀</button>
    <div class="centro"></div>
    <button class="dir" data-dir="right" aria-label="Direita">▶</button>
    <button class="dir" data-dir="down"  aria-label="Baixo">▼</button>
  </div>

  <!-- Botão de ação A no canto direito -->
  <button id="botaoA" aria-label="Ação">A</button>

  <!-- Aviso que aparece só em celular em pé -->
  <div id="girar">Gire o aparelho para jogar na horizontal</div>

  <script src="script.js"></script>
</body>
</html>
