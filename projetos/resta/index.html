<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor & Arte | Restaurante</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte elegante para o restaurante -->
    <link rel="stylesheet" href="https://googleapis.com">
</head>
<body>

    <!-- MENU SUPERIOR -->
    <header class="navbar">
        <div class="logo">Sabor<span>&</span>Arte</div>
        <nav>
            <a href="#">Início</a>
            <a href="#">Cardápio</a>
            <a href="#">Sobre nós</a>
            <a href="#" class="btn-nav">Pedir Agora</a>
        </nav>

    <!-- BANNER PRINCIPAL (HERO) -->
    <section class="hero">
        <div class="hero-content">
            <h1>A verdadeira experiência da culinária artesanal</h1>
            <p>Pratos preparados com ingredientes frescos e selecionados por chefs renomados. Peça o seu delivery ou reserve uma mesa.</p>
            <div class="hero-buttons">
                <a href="#" class="btn-primary">Ver Cardápio</a>
                <a href="#" class="btn-secondary">Fazer Reserva</a>
            </div>
        </div>
        <div class="hero-image">
            <!-- Aqui você coloca a foto de um prato lindo, como um hambúrguer premium ou uma massa -->
            <img src="https://unsplash.com" alt="Prato gourmet premium">
        </div>
    </section>

</body>
</html>
